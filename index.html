<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngga Tutu - Browser Benchmark</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121a;--border:#1e1e2e;--accent:#6c5ce7;--accent2:#00cec9;--text:#e0e0e0;--dim:#666;--green:#00b894;--red:#ff6b6b;--yellow:#fdcb6e;--orange:#e17055;--blue:#74b9ff}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.header{text-align:center;padding:40px 20px 20px;background:linear-gradient(135deg,rgba(108,92,231,.15),rgba(0,206,201,.1));border-bottom:1px solid var(--border)}
.header h1{font-size:2.5rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-1px}
.header p{color:var(--dim);font-size:.95rem}
.lang-toggle{position:fixed;top:16px;right:16px;z-index:100;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--text);cursor:pointer;font-size:.85rem;transition:all .2s}
.lang-toggle:hover{border-color:var(--accent);color:var(--accent)}
.container{max-width:1000px;margin:0 auto;padding:20px}
.controls{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 28px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .25s;text-transform:uppercase;letter-spacing:.5px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(108,92,231,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(108,92,231,.5)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-danger{background:linear-gradient(135deg,var(--red),#c0392b);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;position:relative;overflow:hidden;transition:all .3s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-icon{font-size:1.8rem;margin-bottom:8px}
.card h3{font-size:1rem;margin-bottom:4px;color:var(--text)}
.card .status{font-size:.8rem;color:var(--dim)}
.card .value{font-size:1.5rem;font-weight:700;color:var(--accent2);margin-top:8px;font-variant-numeric:tabular-nums}
.card .value.running{color:var(--yellow);animation:pulse 1s infinite}
.card .value.done{color:var(--green)}
.card .value.error{color:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.card .bar{height:4px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
.card .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s;width:0%}
.log-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:24px}
.log-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.log-header h3{font-size:.95rem;display:flex;align-items:center;gap:8px}
.log-header h3::before{content:'';width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite}
.log-body{height:300px;overflow-y:auto;padding:12px 18px;font-family:'Cascadia Code','Fira Code',monospace;font-size:.82rem;line-height:1.7}
.log-body::-webkit-scrollbar{width:6px}
.log-body::-webkit-scrollbar-track{background:transparent}
.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.log-entry{display:flex;gap:10px}
.log-entry .time{color:var(--dim);min-width:80px;flex-shrink:0}
.log-entry .msg{color:var(--text)}
.log-entry.info .msg{color:var(--blue)}
.log-entry.success .msg{color:var(--green)}
.log-entry.warn .msg{color:var(--yellow)}
.log-entry.error .msg{color:var(--red)}
.log-entry.bench .msg{color:var(--accent2)}
.log-entry.result .msg{color:var(--accent);font-weight:600}
.results-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px;display:none}
.results-panel h3{margin-bottom:16px;font-size:1.1rem}
.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.result-item{background:rgba(255,255,255,.03);border-radius:10px;padding:16px;text-align:center}
.result-item .label{font-size:.8rem;color:var(--dim);margin-bottom:6px}
.result-item .score{font-size:1.8rem;font-weight:700}
.result-item .detail{font-size:.75rem;color:var(--dim);margin-top:4px}
.grade-display{text-align:center;padding:30px}
.grade-letter{font-size:5rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grade-label{font-size:1.1rem;color:var(--dim);margin-top:8px}
.footer{text-align:center;padding:30px;color:var(--dim);font-size:.8rem;border-top:1px solid var(--border)}
.footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>

<div class="header">
  <h1>🖥️ Ngga Tutu Browser</h1>
  <p id="subtitle">Tarayıcı Tabanlı Performans Testi — Lightweight Benchmark Suite</p>
</div>

<div class="container">
  <div class="controls">
    <button class="btn btn-primary" id="startBtn" onclick="runAll()">🚀 <span data-i18n="start">Tüm Testleri Başlat</span></button>
    <button class="btn btn-secondary" onclick="runCategory('cpu')">⚡ CPU</button>
    <button class="btn btn-secondary" onclick="runCategory('memory')">🧠 Memory</button>
    <button class="btn btn-secondary" onclick="runCategory('gpu')">🎮 GPU</button>
    <button class="btn btn-secondary" onclick="runCategory('disk')">💾 Disk</button>
    <button class="btn btn-secondary" onclick="clearLogs()">🗑️ <span data-i18n="clear">Temizle</span></button>
  </div>

  <div class="grid">
    <div class="card" id="cpuCard">
      <div class="card-icon">⚡</div>
      <h3>CPU</h3>
      <div class="status" data-i18n="cpuStatus">Bekleniyor...</div>
      <div class="value" id="cpuScore">—</div>
      <div class="bar"><div class="bar-fill" id="cpuBar"></div></div>
    </div>
    <div class="card" id="memCard">
      <div class="card-icon">🧠</div>
      <h3>Memory</h3>
      <div class="status" data-i18n="memStatus">Bekleniyor...</div>
      <div class="value" id="memScore">—</div>
      <div class="bar"><div class="bar-fill" id="memBar"></div></div>
    </div>
    <div class="card" id="gpuCard">
      <div class="card-icon">🎮</div>
      <h3>GPU</h3>
      <div class="status" data-i18n="gpuStatus">Bekleniyor...</div>
      <div class="value" id="gpuScore">—</div>
      <div class="bar"><div class="bar-fill" id="gpuBar"></div></div>
    </div>
    <div class="card" id="diskCard">
      <div class="card-icon">💾</div>
      <h3>Disk</h3>
      <div class="status" data-i18n="diskStatus">Bekleniyor...</div>
      <div class="value" id="diskScore">—</div>
      <div class="bar"><div class="bar-fill" id="diskBar"></div></div>
    </div>
  </div>

  <div class="results-panel" id="resultsPanel">
    <div class="grade-display">
      <div class="grade-letter" id="gradeLetter">—</div>
      <div class="grade-label" id="gradeLabel" data-i18n="gradeLabel">Genel Puan</div>
    </div>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <div class="log-panel">
    <div class="log-header">
      <h3><span data-i18n="logs">Verbose Log</span></h3>
      <span id="logCount" style="font-size:.8rem;color:var(--dim)">0 entries</span>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>
</div>

<div class="footer">
  <p>Ngga Tutu v0.5.0-lite · <a href="https://github.com/M-K-B-61/nggatutu">GitHub</a> · Browser Benchmark</p>
</div>

<script>
let lang = 'tr';
const i18n = {
  tr: {
    start: 'Tüm Testleri Başlat', clear: 'Temizle', cpuStatus: 'Bekleniyor...', memStatus: 'Bekleniyor...',
    gpuStatus: 'Bekleniyor...', diskStatus: 'Bekleniyor...', gradeLabel: 'Genel Puan', logs: 'Verbose Log',
    running: 'Çalıştırılıyor...', done: 'Tamamlandı', error: 'Hata',
    cpuInit: 'CPU benchmark başlatılıyor...', cpuPrime: 'Asal sayı testi çalışıyor (Sieve of Eratosthenes)...',
    cpuMatrix: 'Matris çarpma testi çalışıyor (512x512)...', cpuCrypto: 'Kripto hash testi çalışıyor (SHA-256)...',
    cpuSort: 'Sıralama testi çalışıyor (dizi sıralama)...', cpuResult: 'CPU Testi Tamamlandı',
    memInit: 'Memory benchmark başlatılıyor...', memAlloc: 'Bellek ayrıştırılıyor (ArrayBuffer)...',
    memSeq: 'Sıralı okuma/yazma testi...', memRand: 'Rastgele erişim testi...', memCopy: 'Kopyalama hızı testi...',
    memResult: 'Memory Testi Tamamlandı',
    gpuInit: 'GPU benchmark başlatılıyor...', gpuCanvas: 'Canvas oluşturma...', gpuDraw: 'Çoklu çizim testi...',
    gpuShader: 'Shader hesaplama testi...', gpuPixel: 'Piksel işleme testi...', gpuResult: 'GPU Testi Tamamlandı',
    diskInit: 'Disk benchmark başlatılıyor...', diskWrite: 'Yazma hızı testi (Blob)...',
    diskRead: 'Okuma hızı testi...', diskParse: 'Parse/test...')
  },
  en: {
    start: 'Run All Tests', clear: 'Clear', cpuStatus: 'Waiting...', memStatus: 'Waiting...',
    gpuStatus: 'Waiting...', diskStatus: 'Waiting...', gradeLabel: 'Overall Grade', logs: 'Verbose Log',
    running: 'Running...', done: 'Done', error: 'Error',
    cpuInit: 'Initializing CPU benchmark...', cpuPrime: 'Running prime sieve test (Sieve of Eratosthenes)...',
    cpuMatrix: 'Running matrix multiplication test (512x512)...', cpuCrypto: 'Running crypto hash test (SHA-256)...',
    cpuSort: 'Running sort test (array sorting)...', cpuResult: 'CPU Test Complete',
    memInit: 'Initializing memory benchmark...', memAlloc: 'Allocating memory (ArrayBuffer)...',
    memSeq: 'Sequential read/write test...', memRand: 'Random access test...', memCopy: 'Copy speed test...',
    memResult: 'Memory Test Complete',
    gpuInit: 'Initializing GPU benchmark...', gpuCanvas: 'Creating canvas...', gpuDraw: 'Multi-draw test...',
    gpuShader: 'Shader computation test...', gpuPixel: 'Pixel processing test...', gpuResult: 'GPU Test Complete',
    diskInit: 'Initializing disk benchmark...', diskWrite: 'Write speed test (Blob)...',
    diskRead: 'Read speed test...', diskParse: 'Parse/test...')
  }
};

let logEntries = 0;
const scores = { cpu: 0, memory: 0, gpu: 0, disk: 0 };

function toggleLang() {
  lang = lang === 'tr' ? 'en' : 'tr';
  document.getElementById('langBtn').textContent = lang === 'tr' ? 'EN' : 'TR';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
}

function log(msg, type = 'info') {
  const body = document.getElementById('logBody');
  const now = new Date().toLocaleTimeString('tr-TR', { hour12: false });
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.innerHTML = `<span class="time">${now}</span><span class="msg">${msg}</span>`;
  body.appendChild(entry);
  body.scrollTop = body.scrollHeight;
  logEntries++;
  document.getElementById('logCount').textContent = `${logEntries} entries`;
}

function updateCard(id, score, status, running = false) {
  const el = document.getElementById(id);
  const val = el.querySelector('.value');
  const bar = el.querySelector('.bar-fill');
  const stat = el.querySelector('.status');
  val.textContent = score;
  val.className = 'value' + (running ? ' running' : (score !== '—' ? ' done' : ''));
  if (status) stat.textContent = status;
  if (typeof score === 'number') bar.style.width = Math.min(score, 100) + '%';
}

function setRunning(cat, running) {
  const cards = { cpu: 'cpuCard', memory: 'memCard', gpu: 'gpuCard', disk: 'diskCard' };
  const card = document.getElementById(cards[cat]);
  if (running) card.style.borderColor = 'var(--accent)';
  else card.style.borderColor = 'var(--border)';
}

function clearLogs() {
  document.getElementById('logBody').innerHTML = '';
  logEntries = 0;
  document.getElementById('logCount').textContent = '0 entries';
}

function fmt(n) { return n.toLocaleString('tr-TR'); }

// ============ CPU BENCHMARK ============
async function benchCPU() {
  setRunning('cpu', true);
  log(i18n[lang].cpuInit, 'info');
  updateCard('cpuScore', '...', i18n[lang].running, true);

  // Test 1: Prime Sieve of Eratosthenes
  log(i18n[lang].cpuPrime, 'bench');
  let t0 = performance.now();
  const N = 5000000;
  const sieve = new Uint8Array(N + 1);
  sieve.fill(1);
  sieve[0] = sieve[1] = 0;
  for (let i = 2; i * i <= N; i++) {
    if (sieve[i]) for (let j = i * i; j <= N; j += i) sieve[j] = 0;
  }
  let primeCount = 0;
  for (let i = 2; i <= N; i++) if (sieve[i]) primeCount++;
  let primeTime = performance.now() - t0;
  log(`  → ${fmt(primeCount)} asal bulundu, ${primeTime.toFixed(1)}ms`, 'result');

  // Test 2: Matrix Multiply (256x256)
  log(i18n[lang].cpuMatrix, 'bench');
  t0 = performance.now();
  const SZ = 256;
  const A = new Float32Array(SZ * SZ);
  const B = new Float32Array(SZ * SZ);
  const C = new Float32Array(SZ * SZ);
  for (let i = 0; i < SZ * SZ; i++) { A[i] = Math.random(); B[i] = Math.random(); }
  for (let i = 0; i < SZ; i++) {
    for (let k = 0; k < SZ; k++) {
      const aik = A[i * SZ + k];
      for (let j = 0; j < SZ; j++) C[i * SZ + j] += aik * B[k * SZ + j];
    }
  }
  let matrixTime = performance.now() - t0;
  let checksum = 0;
  for (let i = 0; i < 100; i++) checksum += C[i * SZ + i];
  log(`  → 256×256 matris çarpma: ${matrixTime.toFixed(1)}ms, checksum: ${checksum.toFixed(4)}`, 'result');

  // Test 3: SHA-256 Hashing (multiple rounds)
  log(i18n[lang].cpuCrypto, 'bench');
  t0 = performance.now();
  const iterations = 5000;
  const data = new TextEncoder().encode('Ngga Tutu Benchmark - Performance Test Data Block 000000');
  let hashResult;
  for (let i = 0; i < iterations; i++) {
    const view = new Uint8Array(data);
    view[view.length - 6] = Math.floor(i / 1000) + 48;
    view[view.length - 5] = Math.floor((i / 100) % 10) + 48;
    view[view.length - 4] = Math.floor((i / 10) % 10) + 48;
    view[view.length - 3] = (i % 10) + 48;
    hashResult = await crypto.subtle.digest('SHA-256', view);
  }
  let cryptoTime = performance.now() - t0;
  const hashHex = Array.from(new Uint8Array(hashResult)).map(b => b.toString(16).padStart(2, '0')).join('');
  log(`  → ${fmt(iterations)} SHA-256 hash: ${cryptoTime.toFixed(1)}ms`, 'result');
  log(`  → Son hash: ${hashHex.substring(0, 32)}...`, 'info');

  // Test 4: Array Sort
  log(i18n[lang].cpuSort, 'bench');
  t0 = performance.now();
  const sortArr = new Array(2000000);
  for (let i = 0; i < sortArr.length; i++) sortArr[i] = Math.random() * 1000000 | 0;
  sortArr.sort((a, b) => a - b);
  let sortTime = performance.now() - t0;
  log(`  → ${fmt(sortArr.length)} eleman sıralama: ${sortTime.toFixed(1)}ms`, 'result');

  // Score calculation
  const primeOps = primeCount / (primeTime / 1000);
  const matrixOps = 1 / (matrixTime / 1000);
  const cryptoOps = iterations / (cryptoTime / 1000);
  const sortOps = sortArr.length / (sortTime / 1000);

  const cpuScore = Math.min(100, Math.round(
    (Math.log10(primeOps) / Math.log10(5000000)) * 25 +
    (Math.log10(matrixOps) / Math.log10(20)) * 25 +
    (Math.log10(cryptoOps) / Math.log10(10000)) * 25 +
    (Math.log10(sortOps) / Math.log10(50000000)) * 25
  ) * 1.1);

  scores.cpu = Math.min(100, cpuScore);
  log(i18n[lang].cpuResult, 'success');
  log(`  → Skor: ${scores.cpu}/100`, 'result');
  updateCard('cpuScore', scores.cpu, `Puan: ${scores.cpu}/100`);
  setRunning('cpu', false);
  return scores.cpu;
}

// ============ MEMORY BENCHMARK ============
async function benchMemory() {
  setRunning('memory', true);
  log(i18n[lang].memInit, 'info');
  updateCard('memScore', '...', i18n[lang].running, true);

  // Test 1: Large allocation + sequential write
  log(i18n[lang].memAlloc, 'bench');
  const SIZE = 64 * 1024 * 1024; // 64MB
  let t0 = performance.now();
  const buf = new ArrayBuffer(SIZE);
  const view8 = new Uint8Array(buf);
  let allocTime = performance.now() - t0;
  log(`  → ${SIZE / 1024 / 1024}MB ArrayBuffer ayrıştırıldı: ${allocTime.toFixed(1)}ms`, 'result');

  // Test 2: Sequential Write
  log(i18n[lang].memSeq, 'bench');
  t0 = performance.now();
  for (let i = 0; i < SIZE; i += 64) view8[i] = i & 0xFF;
  let seqWriteTime = performance.now() - t0;
  let seqWriteSpeed = SIZE / (seqWriteTime / 1000) / 1024 / 1024;
  log(`  → Sıralı yazma: ${seqWriteTime.toFixed(1)}ms — ${seqWriteSpeed.toFixed(0)} MB/s`, 'result');

  // Test 3: Sequential Read
  t0 = performance.now();
  let sum = 0;
  for (let i = 0; i < SIZE; i += 64) sum += view8[i];
  let seqReadTime = performance.now() - t0;
  let seqReadSpeed = SIZE / (seqReadTime / 1000) / 1024 / 1024;
  log(`  → Sıralı okuma: ${seqReadTime.toFixed(1)}ms — ${seqReadSpeed.toFixed(0)} MB/s, checksum: ${sum}`, 'result');

  // Test 4: Random Access
  log(i18n[lang].memRand, 'bench');
  t0 = performance.now();
  const randomIndices = new Uint32Array(1000000);
  for (let i = 0; i < randomIndices.length; i++) randomIndices[i] = (Math.random() * SIZE) | 0;
  sum = 0;
  for (let i = 0; i < randomIndices.length; i++) sum += view8[randomIndices[i]];
  let randTime = performance.now() - t0;
  let randOps = randomIndices.length / (randTime / 1000);
  log(`  → Rastgele erişim: ${randTime.toFixed(1)}ms — ${(randOps / 1000000).toFixed(2)}M ops/s`, 'result');

  // Test 5: Float64 Array (bandwidth)
  log('Float64 bant genişliği testi...', 'bench');
  const floatSize = 16 * 1024 * 1024; // 16M doubles = 128MB
  t0 = performance.now();
  const f64 = new Float64Array(floatSize);
  for (let i = 0; i < floatSize; i += 1024) f64[i] = Math.PI;
  let f64Time = performance.now() - t0;
  let f64Speed = (floatSize * 8) / (f64Time / 1000) / 1024 / 1024;
  log(`  → Float64 yazma: ${f64Time.toFixed(1)}ms — ${f64Speed.toFixed(0)} MB/s`, 'result');

  // Cleanup
  view8.fill(0);
  f64.fill(0);

  const memScore = Math.min(100, Math.round(
    (Math.log10(seqWriteSpeed) / Math.log10(50000)) * 30 +
    (Math.log10(seqReadSpeed) / Math.log10(50000)) * 30 +
    (Math.log10(randOps) / Math.log10(50000000)) * 20 +
    (Math.log10(f64Speed) / Math.log10(50000)) * 20
  ) * 1.1);

  scores.memory = Math.min(100, memScore);
  log(i18n[lang].memResult, 'success');
  log(`  → Skor: ${scores.memory}/100`, 'result');
  updateCard('memScore', scores.memory, `Puan: ${scores.memory}/100`);
  setRunning('memory', false);
  return scores.memory;
}

// ============ GPU BENCHMARK ============
async function benchGPU() {
  setRunning('gpu', true);
  log(i18n[lang].gpuInit, 'info');
  updateCard('gpuScore', '...', i18n[lang].running, true);

  // Create offscreen canvas
  log(i18n[lang].gpuCanvas, 'bench');
  const W = 1920, H = 1080;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  if (!ctx) { log('Canvas context alınamadı!', 'error'); return 0; }
  log(`  → Canvas: ${W}×${H}`, 'info');

  // Test 1: 2D Drawing (大量 shapes)
  log(i18n[lang].gpuDraw, 'bench');
  let t0 = performance.now();
  const SHAPES = 10000;
  for (let i = 0; i < SHAPES; i++) {
    ctx.fillStyle = `hsl(${i % 360}, 70%, 50%)`;
    ctx.fillRect(Math.random() * W, Math.random() * H, 20 + Math.random() * 80, 10 + Math.random() * 60);
  }
  let drawTime = performance.now() - t0;
  let drawOps = SHAPES / (drawTime / 1000);
  log(`  → ${fmt(SHAPES)} shape çizimi: ${drawTime.toFixed(1)}ms — ${(drawOps / 1000).toFixed(1)}K ops/s`, 'result');

  // Test 2: Text rendering
  log('Metin işleme testi...', 'bench');
  t0 = performance.now();
  ctx.font = '14px monospace';
  const textIterations = 50000;
  for (let i = 0; i < textIterations; i++) {
    ctx.fillStyle = `hsl(${i % 360}, 60%, 60%)`;
    ctx.fillText(`Benchmark #${i} — Ngga Tutu`, Math.random() * W, Math.random() * H);
  }
  let textTime = performance.now() - t0;
  log(`  → ${fmt(textIterations)} metin çizimi: ${textTime.toFixed(1)}ms`, 'result');

  // Test 3: ImageData manipulation (pixel processing)
  log(i18n[lang].gpuPixel, 'bench');
  t0 = performance.now();
  const imgData = ctx.getImageData(0, 0, W, H);
  const pixels = imgData.data;
  const pxLen = pixels.length;
  // Brightness adjustment + edge detection
  for (let i = 0; i < pxLen; i += 4) {
    pixels[i] = Math.min(255, pixels[i] + 30);     // R
    pixels[i + 1] = Math.min(255, pixels[i + 1] + 20); // G
    pixels[i + 2] = Math.max(0, pixels[i + 2] - 10);   // B
  }
  ctx.putImageData(imgData, 0, 0);
  let pixelTime = performance.now() - t0;
  let pixelOps = pxLen / (pixelTime / 1000);
  log(`  → ${(pxLen / 4 / 1000000).toFixed(1)}M piksel işleme: ${pixelTime.toFixed(1)}ms — ${(pixelOps / 1000000).toFixed(1)}M px/s`, 'result');

  // Test 4: Gradient + compositing
  log('Gradyan ve compositing testi...', 'bench');
  t0 = performance.now();
  for (let i = 0; i < 1000; i++) {
    const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 400);
    grad.addColorStop(0, `hsla(${i % 360}, 80%, 50%, 0.5)`);
    grad.addColorStop(1, 'transparent');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
  let gradTime = performance.now() - t0;
  log(`  → 1000 gradyan: ${gradTime.toFixed(1)}ms`, 'result');

  // Test 5: WebGL check
  let webglScore = 0;
  try {
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (gl) {
      log('WebGL bulundu, GPU testi çalışıyor...', 'info');
      const maxTexSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      const maxRenderBuf = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);
      const vendor = gl.getParameter(gl.VENDOR);
      const renderer = gl.getParameter(gl.RENDERER);
      log(`  → GPU: ${renderer}`, 'info');
      log(`  → Vendor: ${vendor}`, 'info');
      log(`  → Max Texture: ${maxTexSize}`, 'info');
      log(`  → Max RenderBuffer: ${maxRenderBuf}`, 'info');
      webglScore = 15;
    } else {
      log('  → WebGL bulunamadı (2D benchmark kullanılıyor)', 'warn');
    }
  } catch (e) {
    log(`  → WebGL hatası: ${e.message}`, 'warn');
  }

  const gpuScore = Math.min(100, Math.round(
    (Math.log10(drawOps) / Math.log10(500000)) * 25 +
    (Math.log10(textIterations / (textTime / 1000)) / Math.log10(200000)) * 20 +
    (Math.log10(pixelOps) / Math.log10(1000000000)) * 25 +
    (Math.log10(1000 / (gradTime / 1000)) / Math.log10(5000)) * 15 +
    webglScore
  ) * 1.1);

  scores.gpu = Math.min(100, gpuScore);
  log(i18n[lang].gpuResult, 'success');
  log(`  → Skor: ${scores.gpu}/100`, 'result');
  updateCard('gpuScore', scores.gpu, `Puan: ${scores.gpu}/100`);
  setRunning('gpu', false);
  return scores.gpu;
}

// ============ DISK BENCHMARK ============
async function benchDisk() {
  setRunning('disk', true);
  log(i18n[lang].diskInit, 'info');
  updateCard('diskScore', '...', i18n[lang].running, true);

  // Test 1: Blob creation + read (simulates write)
  log(i18n[lang].diskWrite, 'bench');
  const MB = 1024 * 1024;
  const testDataSize = 32 * MB;

  let t0 = performance.now();
  const chunks = [];
  const chunkSize = 1024 * 1024; // 1MB chunks
  const randomData = new Uint8Array(chunkSize);
  for (let i = 0; i < chunkSize; i++) randomData[i] = (Math.random() * 256) | 0;

  for (let written = 0; written < testDataSize; written += chunkSize) {
    chunks.push(new Blob([randomData], { type: 'application/octet-stream' }));
  }
  let writeTime = performance.now() - t0;
  let writeSpeed = testDataSize / (writeTime / 1000) / MB;
  log(`  → ${testDataSize / MB}MB Blob yazma: ${writeTime.toFixed(1)}ms — ${writeSpeed.toFixed(0)} MB/s`, 'result');

  // Test 2: Read Blob back
  log(i18n[lang].diskRead, 'bench');
  t0 = performance.now();
  let readBytes = 0;
  for (let i = 0; i < chunks.length; i++) {
    const buf = await chunks[i].arrayBuffer();
    readBytes += buf.byteLength;
  }
  let readTime = performance.now() - t0;
  let readSpeed = readBytes / (readTime / 1000) / MB;
  log(`  → ${readBytes / MB}MB okuma: ${readTime.toFixed(1)}ms — ${readSpeed.toFixed(0)} MB/s`, 'result');

  // Test 3: JSON stringify/parse (serialization)
  log(i18n[lang].diskParse, 'bench');
  t0 = performance.now();
  const obj = {};
  for (let i = 0; i < 100000; i++) obj[`key_${i}`] = { val: Math.random(), str: 'benchmark', arr: [1, 2, 3] };
  const jsonStr = JSON.stringify(obj);
  let serializeTime = performance.now() - t0;
  log(`  → 100K obje serialize: ${serializeTime.toFixed(1)}ms — ${(jsonStr.length / MB).toFixed(1)}MB`, 'result');

  t0 = performance.now();
  const parsed = JSON.parse(jsonStr);
  let deserializeTime = performance.now() - t0;
  log(`  → JSON parse: ${deserializeTime.toFixed(1)}ms`, 'result');

  // Test 4: Compression (CompressionStream if available)
  let compressScore = 0;
  try {
    if (typeof CompressionStream !== 'undefined') {
      log('Gzip sıkıştırma testi...', 'bench');
      t0 = performance.now();
      const cs = new CompressionStream('gzip');
      const writer = cs.writable.getWriter();
      writer.write(new TextEncoder().encode(jsonStr));
      writer.close();
      const compressed = await new Response(cs.readable).arrayBuffer();
      let compressTime = performance.now() - t0;
      let ratio = (1 - compressed.byteLength / jsonStr.length) * 100;
      log(`  → Gzip: ${compressTime.toFixed(1)}ms — sıkıştırma: ${ratio.toFixed(1)}%`, 'result');
      compressScore = 15;
    }
  } catch (e) {
    log(`  → CompressionStream desteklenmiyor`, 'warn');
  }

  // Test 5: Performance.now precision (timing overhead)
  log('Timing hassasiyet testi...', 'bench');
  t0 = performance.now();
  let overhead = 0;
  for (let i = 0; i < 1000000; i++) overhead += performance.now() - performance.now();
  let overheadTime = performance.now() - t0;
  log(`  → Timing overhead: ${overheadTime.toFixed(2)}ms (1M ölçüm)`, 'result');

  // Cleanup
  chunks.length = 0;

  const diskScore = Math.min(100, Math.round(
    (Math.log10(writeSpeed) / Math.log10(10000)) * 25 +
    (Math.log10(readSpeed) / Math.log10(10000)) * 25 +
    (Math.log10(1 / (serializeTime / 1000)) / Math.log10(500)) * 25 +
    compressScore +
    5
  ));

  scores.disk = Math.min(100, diskScore);
  log(i18n[lang].diskResult, 'success');
  log(`  → Skor: ${scores.disk}/100`, 'result');
  updateCard('diskScore', scores.disk, `Puan: ${scores.disk}/100`);
  setRunning('disk', false);
  return scores.disk;
}

// ============ ORCHESTRATOR ============
async function runCategory(cat) {
  document.getElementById('startBtn').disabled = true;
  switch (cat) {
    case 'cpu': await benchCPU(); break;
    case 'memory': await benchMemory(); break;
    case 'gpu': await benchGPU(); break;
    case 'disk': await benchDisk(); break;
  }
  document.getElementById('startBtn').disabled = false;
}

async function runAll() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  log('═══════════════════════════════════════════', 'info');
  log('  🚀 Ngga Tutu Browser Benchmark Başlatıldı', 'info');
  log('═══════════════════════════════════════════', 'info');
  log(`  Tarayıcı: ${navigator.userAgent.split(' ').pop()}`, 'info');
  log(`  Çekirdek: ${navigator.hardwareConcurrency || 'Bilinmiyor'}`, 'info');
  log(`  Bellek: ${navigator.deviceMemory || 'Bilinmiyor'}GB`, 'info');
  log(`  Platform: ${navigator.platform}`, 'info');
  log(`  Dil: ${navigator.language}`, 'info');
  log('───────────────────────────────────────────', 'info');

  await benchCPU();
  log('───────────────────────────────────────────', 'info');
  await benchMemory();
  log('───────────────────────────────────────────', 'info');
  await benchGPU();
  log('───────────────────────────────────────────', 'info');
  await benchDisk();
  log('───────────────────────────────────────────', 'info');

  const total = Math.round((scores.cpu * 0.35 + scores.memory * 0.25 + scores.gpu * 0.25 + scores.disk * 0.15));
  let grade = 'E';
  if (total >= 90) grade = 'S';
  else if (total >= 80) grade = 'A';
  else if (total >= 65) grade = 'B';
  else if (total >= 50) grade = 'C';
  else if (total >= 35) grade = 'D';

  document.getElementById('resultsPanel').style.display = 'block';
  document.getElementById('gradeLetter').textContent = grade;
  document.getElementById('resultsGrid').innerHTML = `
    <div class="result-item"><div class="label">CPU</div><div class="score" style="color:var(--accent2)">${scores.cpu}</div><div class="detail">Ağırlık: %35</div></div>
    <div class="result-item"><div class="label">Memory</div><div class="score" style="color:var(--accent2)">${scores.memory}</div><div class="detail">Ağırlık: %25</div></div>
    <div class="result-item"><div class="label">GPU</div><div class="score" style="color:var(--accent2)">${scores.gpu}</div><div class="detail">Ağırlık: %25</div></div>
    <div class="result-item"><div class="label">Disk</div><div class="score" style="color:var(--accent2)">${scores.disk}</div><div class="detail">Ağırlık: %15</div></div>
    <div class="result-item"><div class="label">TOPLAM</div><div class="score" style="color:var(--accent);font-size:2.2rem">${total}</div><div class="detail">Grade: ${grade}</div></div>
  `;

  log('═══════════════════════════════════════════', 'success');
  log(`  ✅ BENCHMARK TAMAMLANDI — TOPLAM: ${total}/100 (${grade})`, 'success');
  log(`  CPU: ${scores.cpu} | Memory: ${scores.memory} | GPU: ${scores.gpu} | Disk: ${scores.disk}`, 'result');
  log('═══════════════════════════════════════════', 'success');

  btn.disabled = false;
}
